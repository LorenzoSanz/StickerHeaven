# Redis prod config
#
# Esta configuración es utilizada para producción.
# Se conecta solo a la interfaz local para mayor seguridad y activa el modo protegido.
#
bind 0.0.0.0
port 6379
protected-mode yes

#Mirar `redis.dev.conf` para más detalles si no me acuerdo de estas.
save ""
appendonly no

maxmemory 256mb
maxmemory-policy volatile-ttl

tcp-keepalive 300
timeout 0
