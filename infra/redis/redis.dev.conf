# Redis dev config
#
# Esta configuración es utilizada para desarrollo local.
# Se conecta a todas las interfaces para permitir conexiones desde el host y desactiva el modo protegido.

bind 0.0.0.0
port 6379
protected-mode no

# `save ""` desactiva la persistencia en disco.
# `appendonly no` desactiva el registro de operaciones en disco.    
save ""
appendonly no

# Memoria / eviction
# Como todas las keys tienen TTL, se usa `maxmemory-policy volatile-ttl`.
# Hay que ajustar `maxmemory` aquí para tráfico.
maxmemory 256mb
maxmemory-policy volatile-ttl

# Ajusta `tcp-keepalive` y `timeout` según necesidades. Sirven para detectar conexiones abiertas y cerradas.
tcp-keepalive 300
timeout 0
