# POR QUÉ: Configuración básica de Nginx.
# QUÉ: Configura Nginx para manejar solicitudes HTTP y HTTPS.
user nginx;
worker_processes auto;

pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  multi_accept on;
}


http { 
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # POR QUÉ: Configuración de formato de registro para Nginx.
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" request_id=$request_id '
                  'request_time=$request_time upstream_addr=$upstream_addr '
                  'upstream_status=$upstream_status upstream_time=$upstream_response_time';

  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;
  
  # POR QUÉ: Configuración de registro de errores para Nginx.
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;


  # QUÉ: Desactiva la inclusión de tokens de servidor en las respuestas.
  server_tokens off;
  
  # POR QUÉ: Configuración de compresión gzip para Nginx.
  # QUÉ: Habilita la compresión gzip para mejorar el rendimiento.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;
  

  # QUÉ: Configura encabezados para manejar conexiones HTTP/2.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }
  include /etc/nginx/conf.d/*.conf;
}
