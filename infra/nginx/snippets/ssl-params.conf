# Configuración de parámetros de SSL para Nginx.
# Sirve para manejar conexiones seguras.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

# Ajustar `ssl_session_timeout` y `ssl_session_cache` según necesidades.
# `ssl_session_timeout` es el tiempo que una sesión SSL puede estar abierta sin actividad.
# `ssl_session_cache` es la caché de sesiones SSL para mejorar el rendimiento.
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

ssl_stapling on;
ssl_stapling_verify on;

resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;
