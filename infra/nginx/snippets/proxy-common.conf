# Configuración de encabezados para proxy en Nginx.
# Sirve para manejar solicitudes a través de un proxy.
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port $server_port;

# Ajustar `X-Real-IP` y `X-Forwarded-For` según necesidades.
# `X-Real-IP` es la dirección IP real del cliente.
# `X-Forwarded-For` es la lista de direcciones IP que se han pasado a través de proxies.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;

proxy_set_header X-Request-ID $request_id;

proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_set_header CF-Connecting-IP "";

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

proxy_redirect off;
