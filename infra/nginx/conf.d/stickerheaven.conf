# POR QUÉ: Configuración de proxy para StickerHeaven.
# QUÉ: Configura proxy para manejar solicitudes a StickerHeaven.


upstream stickerheaven_web {
  server 127.0.0.1:3000;
  keepalive 32;
}

upstream stickerheaven_api {
  server 127.0.0.1:3001;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;

  server_name _;
  # POR QUÉ: Redirección HTTP a HTTPS.
  # QUÉ: Redirecciona todas las solicitudes HTTP a HTTPS.
  client_max_body_size 20m;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;

  server_name _;

  client_max_body_size 20m;

  # POR QUÉ: Configuración de SSL para StickerHeaven.
  # QUÉ: Configura SSL para manejar solicitudes seguras a StickerHeaven.
  ssl_certificate /etc/letsencrypt/live/stickerheaven.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/stickerheaven.com/privkey.pem;

  include /etc/nginx/snippets/ssl-params.conf;

  location ~ /\.(?!well-known) {
    deny all;
  }

  location = /health {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://stickerheaven_api;
  }

  location /api/ {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://stickerheaven_api;
  }

  location / {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://stickerheaven_web;
  }
}
